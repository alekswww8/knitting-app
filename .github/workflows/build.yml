name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Fix workspace permissions
        run: |
          git config --global --add safe.directory /__w/knitting-app/knitting-app

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Fix artifact ownership
        run: |
          chown -R 1001:1001 bin/ || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
